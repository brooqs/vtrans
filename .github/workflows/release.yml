name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commit history, so it needs
          # the whole thing rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          # The only credential this workflow needs. There is deliberately no
          # AUR key: the PKGBUILD is attached to the release rather than pushed
          # to aur.archlinux.org, so nothing here can publish code on the
          # maintainer's behalf. See the aurs block in .goreleaser.yaml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
